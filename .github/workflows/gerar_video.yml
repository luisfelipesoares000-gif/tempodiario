name: Gerar Video Tempo Diario

on:
  push:
    branches:
      - main
    paths:
      - "gerar_video.py"
      - "requirements.txt"
      - "index.html"
      - ".github/workflows/*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o vídeo
        run: python gerar_video.py

      - name: Salvar video.mp4 no repositório
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video.mp4
          git diff --staged --quiet || git commit -m "Atualiza video.mp4 [skip ci]"
          git push

      - name: Preparar arquivos do site
        run: |
          mkdir -p _site
          cp index.html video.mp4 _site/

      - name: Enviar site para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4s
